<!DOCTYPE html>
<html>
<head>
    <title>Login Validation</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        p {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Login Form</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <input type="text" id="phone" placeholder="Phone Number">

    <input type="text" id="email" placeholder="Email">

    <button onclick="validate()">Submit</button>

    <p id="msg"></p>
</div>

<script>
function validate()
{
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let phone = document.getElementById("phone").value;
    let email = document.getElementById("email").value;

    let message = "";

    // Username
    if(username.length < 3)
    {
        message += "Username must contain at least 3 characters.<br>";
    }

    // Password
    let passRegex = /^(?=.*\d)(?=.*[!@#$%^&*]).{6,}$/;

    if(!passRegex.test(password))
    {
        message += "Password must be at least 6 characters, contain one number and one special character.<br>";
    }

    // Phone Number
    let phoneRegex = /^[0-9]{10}$/;

    if(!phoneRegex.test(phone))
    {
        message += "Phone number must contain exactly 10 digits.<br>";
    }

    // Email
    let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailRegex.test(email))
    {
        message += "Invalid Email Address.<br>";
    }

    if(message == "")
    {
        document.getElementById("msg").style.color = "green";
        document.getElementById("msg").innerHTML = "Login Successful!";
    }
    else
    {
        document.getElementById("msg").style.color = "red";
        document.getElementById("msg").innerHTML = message;
    }
}
</script>

</body>
</html>
